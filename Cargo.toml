[workspace]
resolver = "3"
members = [
    "crates/aeris_charts_core",
    "crates/aeris_charts_indicators",
    "crates/aeris_charts_engine",
    "crates/aeris_charts_render",
    "crates/aeris_charts_render_wgpu",
    "crates/aeris_charts_render_gpui",
    "crates/aeris_charts_wasm",
    "crates/aeris_charts_native",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["Aeris Terminal"]
repository = "https://github.com/aeristerminal/aeris-charts"
# Rust crates are consumed from this repository only; nothing is published to crates.io.
publish = false

# Shared lint policy; every crate opts in via `[lints] workspace = true`.
# CI enforces clippy with `-D warnings` on top of this.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# External deps (wgpu, naga, wasm-bindgen, ...) dominate the wasm binary; our hot loops
# live in workspace crates, which stay at opt-level 3. This trims download size without
# touching engine throughput (headless perf gates measure workspace code).
[profile.release.package."*"]
opt-level = "z"

# wasm release builds care about size too; tune later per-target.
