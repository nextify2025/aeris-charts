[package]
name = "stock-detail"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
description = "A stock detail page with a full K-line chart: gpui-kit UI around the Aeris chart engine, with KLineChart's indicators and drawing tools"

[[bin]]
name = "stock-detail"
path = "src/main.rs"

[features]
# A live Longbridge OpenAPI feed: `--features longbridge -- --symbol AAPL.US`, with credentials in
# LONGBRIDGE_APP_KEY, LONGBRIDGE_APP_SECRET and LONGBRIDGE_ACCESS_TOKEN.
longbridge = ["dep:longbridge", "dep:rust_decimal", "dep:time", "dep:time-tz"]

[dependencies]
# gpui-kit 0.6.6 brings GPUI (`gpui-pre` 0.3.6) and the component library; the Aeris GPUI executor
# pins the same GPUI, so chart painting and the UI share one `gpui` crate.
gpui-kit = "=0.6.6"
aeris_charts_core = { path = "../../crates/aeris_charts_core" }
aeris_charts_engine = { path = "../../crates/aeris_charts_engine" }
aeris_charts_render = { path = "../../crates/aeris_charts_render" }
aeris_charts_render_gpui = { path = "../../crates/aeris_charts_render_gpui", features = [
    "gpui-backend",
] }
longbridge = { version = "5.1.0", optional = true, features = ["blocking"] }
rust_decimal = { version = "1", optional = true }
time = { version = "0.3", optional = true }
time-tz = { version = "2", optional = true }

[profile.dev]
# GPUI is slow unoptimized; keep dependencies optimized while the app itself stays debuggable.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# A standalone workspace: the repository workspace excludes this directory.
[workspace]
