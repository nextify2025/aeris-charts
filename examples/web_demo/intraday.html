<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Aeris Charts — 分时 intraday</title>
<link rel="stylesheet" href="./dist/aeris_charts.css" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--surface); }
  html { -webkit-font-smoothing: antialiased; }
  body { color: var(--text-primary); font-family: var(--font-sans); font-size: 13px; }
  button, a { font: inherit; }
  #wrap { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px 16px; border-bottom: var(--border-width) solid var(--border); }
  .instrument { display: grid; line-height: 1.3; min-width: 0; }
  .instrument strong { font-size: 14px; font-weight: 650; }
  .instrument span { color: var(--text-secondary); font-size: 11px; }
  .quote { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; font-variant-numeric: tabular-nums; }
  .quote dl { display: contents; }
  .quote div { display: flex; gap: 6px; align-items: baseline; }
  .quote dt { color: var(--text-secondary); font-size: 11px; }
  .quote dd { margin: 0; font-weight: 600; }
  #last_price { font-size: 18px; }
  [data-direction="up"] { color: #f7525f; }
  [data-direction="down"] { color: #089981; }
  nav { display: flex; gap: 2px; margin-left: auto; padding: 3px; background: var(--surface-secondary); border: var(--border-width) solid var(--border); border-radius: 9px; }
  nav a, nav button { display: inline-grid; place-items: center; min-width: 44px; height: 32px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--text-secondary); font-size: 12px; font-weight: 600; text-decoration: none; cursor: pointer; }
  nav a:hover, nav button:hover { background: var(--hover-bg); color: var(--text-primary); }
  nav a[aria-current="true"], nav button[aria-pressed="true"] { background: var(--surface); color: var(--primary); box-shadow: 0 0 0 var(--border-width) var(--border-secondary); }
  nav a:focus-visible, nav button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  #chart { position: relative; min-width: 0; min-height: 0; }
  @media (max-width: 640px) {
    header { padding: 8px 12px; }
    nav { margin-left: 0; }
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="instrument">
      <strong>模拟股份 SIM.SH</strong>
      <span>分时 · 沪A · 合成行情 Synthetic data</span>
    </div>
    <div class="quote" aria-live="polite">
      <dl>
        <div><dt>最新</dt><dd id="last_price">—</dd></div>
        <div><dt>涨跌</dt><dd id="last_change">—</dd></div>
        <div><dt>均价</dt><dd id="last_average">—</dd></div>
        <div><dt>成交量</dt><dd id="last_volume">—</dd></div>
        <div><dt>时间</dt><dd id="last_time">—</dd></div>
      </dl>
    </div>
    <nav aria-label="Intraday views">
      <a href="?days=1" data-days="1">分时</a>
      <a href="?days=5" data-days="5">五日</a>
      <button id="feed_toggle" type="button" aria-pressed="false">▶ 行情</button>
      <a href="./index.html">Market lab</a>
    </nav>
  </header>
  <div id="chart" aria-label="Intraday time-sharing chart"></div>
</div>
<script type="module" src="./intraday.js"></script>
</body>
</html>
