name: Benchmark nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  RUSTUP_TOOLCHAIN: stable
  AERIS_CHARTS_BENCH_ENV_CLASS: shared-ci
  AERIS_CHARTS_BENCH_ENV_ID: github-ubuntu-nightly

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0
      - run: npm ci
        working-directory: packages/charts
      - run: npm ci
        working-directory: examples/web_demo
      - run: npx playwright install --with-deps chromium
        working-directory: examples/web_demo
      - run: node benchmarks/benchmark.mjs nightly
      - run: node benchmarks/benchmark.mjs native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-nightly
          path: benchmarks/results/
          if-no-files-found: error
          retention-days: 30
