name: Benchmark release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
  AERIS_CHARTS_BENCH_ENV_CLASS: official-benchmark-runner
  AERIS_CHARTS_BENCH_ENV_ID: official-win-gpu-01

jobs:
  release:
    runs-on: [self-hosted, benchmark, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0-x86_64-pc-windows-msvc
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0
      - run: npm ci
        working-directory: packages/charts
      - run: npm ci
        working-directory: examples/web_demo
      - run: npx playwright install chromium
        working-directory: examples/web_demo
      - name: Full clean release benchmark
        run: node benchmarks/benchmark.mjs release
      - name: Separate native diagnostics
        run: node benchmarks/benchmark.mjs native
      - name: Generate evidence artifacts
        shell: pwsh
        run: |
          $result = Get-ChildItem benchmarks/results/v*/*/*-release.json | Sort-Object LastWriteTime | Select-Object -Last 1
          node benchmarks/benchmark.mjs report $result.FullName
          node benchmarks/benchmark.mjs public $result.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-release-${{ github.ref_name }}
          path: benchmarks/results/
          if-no-files-found: error
          retention-days: 90
