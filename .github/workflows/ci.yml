name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  namespace:
    name: Namespace guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node packages/charts/scripts/namespace_guard.mjs

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Install Linux GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (native, all targets)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (wasm32)
        run: cargo clippy -p aeris_charts_wasm --target wasm32-unknown-unknown --locked -- -D warnings
      - name: tests (includes golden-image regression)
        run: cargo test --workspace --locked
      - name: perf gate (hard configured budgets)
        run: cargo run -p aeris_charts_native --example perf_gate --release
        env:
          AERIS_CHARTS_PERF_STRICT: "1"

  native-gpui:
    name: Native GPUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - uses: Swatinem/rust-cache@v2
      - name: Test native GPUI backend
        run: cargo test -p aeris_charts_render_gpui --features gpui-backend --all-targets --locked

  package:
    name: TypeScript package (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0
      - name: Install package deps
        working-directory: packages/charts
        run: npm ci
      - name: Lint
        working-directory: packages/charts
        run: npm run lint
      - name: Build (wasm + bundle + types)
        working-directory: packages/charts
        run: npm run build
      - name: Enforce production artifact size budgets
        run: node benchmarks/benchmark.mjs size
      - name: Typecheck
        working-directory: packages/charts
        run: npm run typecheck
      - name: Public API compatibility snapshot
        working-directory: packages/charts
        run: npm run check:api
      - name: Release gate policy simulation
        working-directory: packages/charts
        run: npm run check:release-gates
      - name: Pack smoke test (tarball installs and imports)
        working-directory: packages/charts
        run: npm run test:pack

  browser:
    name: Browser runtime & parity (Playwright)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0
      - name: Install package deps
        working-directory: packages/charts
        run: npm ci
      - name: Install demo deps
        working-directory: examples/web_demo
        run: npm ci
      - name: Build package and demo assets
        working-directory: examples/web_demo
        run: npm run build
      - name: Install Playwright browsers
        working-directory: examples/web_demo
        run: npx playwright install --with-deps
      - name: Run required portable browser suite
        id: portable-browser-suite
        working-directory: examples/web_demo
        run: npx playwright test
        env:
          AERIS_CHARTS_PORTABLE_BROWSER: "1"
      - name: Run machine-sensitive pixel/GPU/performance evidence
        id: machine-evidence
        continue-on-error: true
        working-directory: examples/web_demo
        run: npx playwright test tests/backend-parity.spec.mjs tests/engine-bench.spec.mjs tests/frame-stats.spec.mjs tests/gpui-webgpu-matrix.spec.mjs tests/perf-gate.spec.mjs --project=chromium
      - name: Run machine-sensitive retention-memory evidence
        id: machine-retention-evidence
        continue-on-error: true
        working-directory: examples/web_demo
        run: npx playwright test tests/retention.spec.mjs --project=chromium --grep @machine
      - uses: actions/upload-artifact@v4
        if: failure() || steps.machine-evidence.outcome == 'failure' || steps.machine-retention-evidence.outcome == 'failure'
        with:
          name: playwright-report
          path: examples/web_demo/playwright-report/
          retention-days: 7
