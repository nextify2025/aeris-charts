name: Metrics smoke

on:
  pull_request:
  push:
    branches: [main]

env:
  RUSTUP_TOOLCHAIN: 1.99.0
  AERIS_CHARTS_BENCH_ENV_CLASS: shared-ci
  AERIS_CHARTS_BENCH_ENV_ID: github-ubuntu-shared

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0
      - run: bun install --frozen-lockfile
        working-directory: packages/charts
      - run: bun install --frozen-lockfile
        working-directory: examples/web_demo
      - run: bunx playwright install --with-deps chromium
        working-directory: examples/web_demo
      - name: Harness tests
        run: node benchmarks/benchmark.mjs test
      - name: Production size and browser smoke
        run: node benchmarks/benchmark.mjs smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: metrics-smoke
          path: benchmarks/results/
          if-no-files-found: error
          retention-days: 14
