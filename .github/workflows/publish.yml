name: Publish

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.0

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@aeristerminal"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0
      - name: Install package deps
        working-directory: packages/charts
        run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        working-directory: packages/charts
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME !== 'v'+p.version)throw new Error('tag '+process.env.GITHUB_REF_NAME+' does not match package v'+p.version)"
      - name: Verify source passed CI
        shell: bash
        run: |
          validated=""
          for sha in $(git rev-list "$GITHUB_SHA"); do
            count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f head_sha="$sha" -f status=success -f per_page=1 --jq '.total_count')
            if [[ "$count" -gt 0 ]]; then
              validated="$sha"
              break
            fi
          done
          if [[ -z "$validated" ]]; then
            echo "No successful CI run found for the release source or its ancestors" >&2
            exit 1
          fi
          unexpected=$(git diff --name-only "$validated" "$GITHUB_SHA" | grep -Ev '^(\.github/workflows/|packages/charts/scripts/release_gate_guard\.mjs$)' || true)
          if [[ -n "$unexpected" ]]; then
            echo "Release contains unvalidated source changes:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish latest (prepublishOnly rebuilds + pack-smokes first)
        working-directory: packages/charts
        run: npm publish --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
